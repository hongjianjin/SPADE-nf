name: Build SPADE container

on:
  workflow_dispatch:
    inputs:
      spade_ref:
        description: "hongjianjin/SPADE git tag to copy into the image"
        default: "3.0.1"
  push:
    branches: [main]
    paths:
      - "containers/spade/**"
      - ".github/workflows/build-container.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REF: ${{ github.event.inputs.spade_ref || '3.0.1' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        run: echo "TAG=${REF#v}" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v6
        with:
          context: containers/spade
          build-args: SPADE_REF=${{ env.REF }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/spade:${{ env.TAG }}
            ghcr.io/${{ github.repository_owner }}/spade:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
